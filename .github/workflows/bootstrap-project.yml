name: Bootstrap project source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/chunks/part-06.b64"

permissions:
  contents: write

jobs:
  expand-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/chunks/part-06.b64
          cat bootstrap/chunks/part-*.b64 | base64 -d > /tmp/rag-project.zip
          mkdir -p /tmp/rag-source
          unzip -q /tmp/rag-project.zip -d /tmp/rag-source
          test -d /tmp/rag-source/rag-knowledge-assistant
          cp -a /tmp/rag-source/rag-knowledge-assistant/. .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-project.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No expanded project changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add RAG Knowledge Assistant source and documentation"
          git push origin HEAD:main
